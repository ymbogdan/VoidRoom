name: VoidRoom
main: it.ymbogdan.voidroom.VoidRoomPlugin
version: 1.0.0
api-version: '1.20'
authors: [ymbogdan]
description: Prevent players from equipping elytra inside a configured region.
website: https://bstats.org/plugin/bukkit/VoidRoom/33389
commands:
  voidroom:
    description: Manage the VoidRoom region
    usage: /voidroom <select|confirm|pos1|pos2|save|reload>
    permission: voidroom.admin
permissions:
  voidroom.admin:
    description: Allows managing VoidRoom regions and reloading the plugin
    default: op
